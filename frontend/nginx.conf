# משרת את קבצי הדשבורד הסטטיים, ומעביר (proxy) את קריאות ה-API ל-backend
# על אותו origin - כך שהדפדפן לא צריך CORS, ומול הלקוח זה עדיין נראה כמו
# שירות אחד, בדיוק כמו לפני הפרדת ה-frontend/backend לקונטיינרים נפרדים.
server {
  listen 80;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # resolver + משתנה ב-proxy_pass (במקום hostname קבוע) גורמים ל-nginx
  # לפענח את "backend" בזמן בקשה, לא בזמן עליית nginx - אחרת nginx נכשל
  # להתחיל אם backend עוד לא resolvable ברגע ה-startup (למשל אחרי restart).
  resolver 127.0.0.11 valid=10s;

  # $request_uri (המסלול+query המקורי, לא נורמל) נשלח כמו שהוא ל-backend:
  # כש-proxy_pass מכיל משתנה, nginx לא עושה את החלפת ה-prefix הרגילה
  # (ה-URI שאחרי המשתנה נשלח כמות שהוא, בלי לצרף את שאריות ה-path המקורי),
  # אז חובה לצרף את $request_uri במפורש כדי לא לאבד את שאריות ה-path.
  location /v1/ {
    set $backend_upstream backend:3000;
    proxy_pass http://$backend_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    set $backend_upstream backend:3000;
    proxy_pass http://$backend_upstream$request_uri;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
